<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учет смен — Вкусно и точка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 pb-12 font-sans selection:bg-amber-500 selection:text-black">
  <script>
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

  <!-- Сводка за месяц -->
  <div class="bg-slate-800/90 backdrop-blur rounded-2xl p-4 shadow-xl mb-4 border border-slate-700/70">
    <div class="flex justify-between items-center mb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Итоги месяца</span>
      <input type="month" id="filterMonth" class="bg-slate-700 text-xs rounded-lg px-2 py-1 outline-none text-white border border-slate-600" onchange="renderShifts()">
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-slate-700/50 p-2.5 rounded-xl border border-slate-600/30">
        <p class="text-[11px] text-slate-400">Смен</p>
        <p id="totalShifts" class="text-xl font-bold text-amber-400">0</p>
      </div>
      <div class="bg-slate-700/50 p-2.5 rounded-xl border border-slate-600/30">
        <p class="text-[11px] text-slate-400">Всего часов</p>
        <p id="totalHours" class="text-xl font-bold text-sky-400">0</p>
      </div>
      <div class="bg-slate-700/50 p-2.5 rounded-xl border border-slate-600/30">
        <p class="text-[11px] text-slate-400">Заработок</p>
        <p id="totalEarned" class="text-xl font-bold text-emerald-400">0 ₽</p>
      </div>
    </div>
  </div>

  <!-- Настройки ставки и налога -->
  <div class="bg-slate-800 rounded-xl p-3.5 mb-4 border border-slate-700/70 space-y-3">
    <div class="flex items-center justify-between">
      <span class="text-xs text-slate-300">Ставка в час (до вычета):</span>
      <div class="flex items-center gap-1.5">
        <input type="number" id="baseRate" value="250" class="w-20 bg-slate-700 text-center font-bold rounded-lg py-1 text-sm text-white outline-none border border-slate-600 focus:border-amber-400" onchange="saveSettings()">
        <span class="text-xs text-slate-400">₽</span>
      </div>
    </div>
    <div class="flex items-center justify-between pt-2 border-t border-slate-700/50 text-xs">
      <span class="text-slate-300">Показывать сумму «на руки» (-13% НДФЛ):</span>
      <input type="checkbox" id="taxDeduction" class="w-4 h-4 accent-amber-500 rounded cursor-pointer" onchange="saveSettings()">
    </div>
  </div>

  <!-- Добавление смены -->
  <div class="bg-slate-800 rounded-2xl p-4 shadow-xl mb-4 border border-slate-700/70">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-bold text-slate-200">Добавить смену</h3>
      <!-- Быстрый выбор даты -->
      <div class="flex gap-1.5 text-xs">
        <button type="button" onclick="setDateOffset(-1)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-300 active:scale-95">Вчера</button>
        <button type="button" onclick="setDateOffset(0)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-300 active:scale-95">Сегодня</button>
      </div>
    </div>

    <!-- Шаблоны в один клик -->
    <div class="flex gap-2 mb-3">
      <button type="button" onclick="applyPreset('night')" class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs py-1.5 rounded-lg font-medium active:scale-95 transition">
        🌙 Ночная (23:00–08:00)
      </button>
      <button type="button" onclick="applyPreset('day')" class="flex-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 border border-slate-600 text-xs py-1.5 rounded-lg active:scale-95 transition">
        ☀️ Дневная (08:00–17:00)
      </button>
    </div>

    <form id="shiftForm" onsubmit="addShift(event)" class="space-y-3">
      <div>
        <label class="text-[11px] text-slate-400 block mb-1">Дата выхода на смену</label>
        <input type="date" id="shiftDate" required class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2 text-sm text-white outline-none">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Начало</label>
          <input type="time" id="startTime" required value="23:00" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2 text-sm text-white outline-none">
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Конец</label>
          <input type="time" id="endTime" required value="08:00" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2 text-sm text-white outline-none">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Обед (мин)</label>
          <input type="number" id="breakMinutes" value="60" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2 text-sm text-white outline-none">
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Позиция / Зона</label>
          <input type="text" id="station" value="Ночник" placeholder="Ночник / Кухня" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2 text-sm text-white outline-none">
        </div>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-slate-950 font-bold py-2.5 rounded-xl text-sm transition mt-1">
        Добавить смену
      </button>
    </form>
  </div>

  <!-- Список смен -->
  <div class="space-y-2">
    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Смены за выбранный месяц</h3>
    <div id="shiftsList" class="space-y-2"></div>
  </div>

  <script>
    const STORAGE_KEY = 'vto_shifts_v2';
    const SETTINGS_KEY = 'vto_settings_v2';

    // Загрузка настроек
    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"rate": 250, "tax": true}');
    document.getElementById('baseRate').value = settings.rate;
    document.getElementById('taxDeduction').checked = settings.tax;

    // Инициализация дат: по умолчанию ставим вчера (удобно после ночной)
    setDateOffset(-1);
    document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);

    function setDateOffset(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      document.getElementById('shiftDate').value = d.toISOString().split('T')[0];
    }

    function applyPreset(type) {
      if (type === 'night') {
        document.getElementById('startTime').value = '23:00';
        document.getElementById('endTime').value = '08:00';
        document.getElementById('breakMinutes').value = '60';
        document.getElementById('station').value = 'Ночник';
      } else {
        document.getElementById('startTime').value = '08:00';
        document.getElementById('endTime').value = '17:00';
        document.getElementById('breakMinutes').value = '30';
        document.getElementById('station').value = 'День';
      }
    }

    function saveSettings() {
      settings = {
        rate: parseFloat(document.getElementById('baseRate').value) || 250,
        tax: document.getElementById('taxDeduction').checked
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      renderShifts();
    }

    // Точный расчет ночных и дневных часов с учетом вычета обеда из ночи
    function calculateShift(startStr, endStr, breakMin, dateStr, rate, applyTax) {
      let start = new Date(`${dateStr}T${startStr}`);
      let end = new Date(`${dateStr}T${endStr}`);
      if (end <= start) end.setDate(end.getDate() + 1);

      let totalGrossMin = (end - start) / (1000 * 60);
      let paidMinutes = Math.max(0, totalGrossMin - breakMin);
      let totalHours = paidMinutes / 60;

      // Считаем брутто-минуты в ночном интервале (22:00 - 06:00)
      let rawNightMin = 0;
      let cur = new Date(start);
      while (cur < end) {
        let h = cur.getHours();
        if (h >= 22 || h < 6) rawNightMin += 1;
        cur.setMinutes(cur.getMinutes() + 1);
      }

      // При ночной смене обед вычитается из ночных часов
      let nightMin = Math.max(0, rawNightMin - breakMin);
      let nightHours = nightMin / 60;
      let dayHours = Math.max(0, totalHours - nightHours);

      // Оплата: база + 20% за каждый ночной час (ст. 154 ТК РФ)
      let grossPay = (dayHours * rate) + (nightHours * rate * 1.2);
      let finalPay = applyTax ? grossPay * 0.87 : grossPay;

      return {
        totalHours,
        nightHours,
        dayHours,
        earned: Math.round(finalPay)
      };
    }

    function addShift(e) {
      e.preventDefault();
      const date = document.getElementById('shiftDate').value;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const breakMin = parseInt(document.getElementById('breakMinutes').value) || 0;
      const station = document.getElementById('station').value.trim() || 'Ночник';

      const shifts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      shifts.push({ id: Date.now(), date, start, end, breakMin, station });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts));
      renderShifts();
    }

    function deleteShift(id) {
      let shifts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      shifts = shifts.filter(s => s.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts));
      renderShifts();
    }

    function renderShifts() {
      const shifts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const selectedMonth = document.getElementById('filterMonth').value;

      const container = document.getElementById('shiftsList');
      container.innerHTML = '';

      let monthTotalHours = 0;
      let monthTotalEarned = 0;
      let count = 0;

      const filtered = shifts
        .filter(s => s.date.startsWith(selectedMonth))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      filtered.forEach(shift => {
        count++;
        const stats = calculateShift(shift.start, shift.end, shift.breakMin, shift.date, settings.rate, settings.tax);
        monthTotalHours += stats.totalHours;
        monthTotalEarned += stats.earned;

        const dateParts = shift.date.split('-');
        const dateFormatted = `${dateParts[2]}.${dateParts[1]}`;

        const el = document.createElement('div');
        el.className = 'bg-slate-800 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center';
        el.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-slate-100">${dateFormatted}</span>
              <span class="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-md font-medium">${shift.station}</span>
            </div>
            <p class="text-xs text-slate-400 mt-1">${shift.start} - ${shift.end} (обед ${shift.breakMin}м)</p>
          </div>
          <div class="text-right flex items-center gap-3">
            <div>
              <p class="text-sm font-bold text-emerald-400">+${stats.earned.toLocaleString('ru-RU')} ₽</p>
              <p class="text-[11px] text-slate-400">${stats.totalHours.toFixed(1)} ч (${stats.nightHours.toFixed(0)}н + ${stats.dayHours.toFixed(0)}д)</p>
            </div>
            <button onclick="deleteShift(${shift.id})" class="text-slate-500 hover:text-red-400 text-lg px-1 transition active:scale-90">✕</button>
          </div>
        `;
        container.appendChild(el);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">В этом месяце смен пока нет</p>`;
      }

      document.getElementById('totalShifts').textContent = count;
      document.getElementById('totalHours').textContent = monthTotalHours.toFixed(1);
      document.getElementById('totalEarned').textContent = `${monthTotalEarned.toLocaleString('ru-RU')} ₽`;
    }

    renderShifts();
  </script>
</body>
</html>
